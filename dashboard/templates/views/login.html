{{define "content"}}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class=" "><img  style="width: 64px; height: 64px;" src="/dashboard/assets/logo.png"/></div>
      <h1>Breeze Dashboard</h1>
      <p>Sign in to continue</p>
    </div>
    <form id="login-form" class="login-form" autocomplete="off">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="admin" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••" required>
      </div>
      <div id="login-error" class="login-error" style="display:none"></div>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
    <div class="login-footer">
      <span>Breeze Framework · Developer Dashboard</span>
    </div>
  </div>
</div>
<style>
/* The wrapper is transparent so the gradient wash set on <body> in
   login_layout.html shows through behind the card. */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;padding:20px}
/* Glass card, matching the surfaces in dashboard.css. */
.login-card{
  background:var(--glass);
  backdrop-filter:saturate(175%) blur(18px);
  -webkit-backdrop-filter:saturate(175%) blur(18px);
  border:1px solid var(--glass-brd);
  border-radius:26px;padding:40px;width:394px;max-width:100%;
  box-shadow:var(--sh-card),var(--sh-inset);
}
.login-header{text-align:center;margin-bottom:28px}
.login-logo{width:60px;height:60px;border-radius:19px;background:linear-gradient(140deg,var(--primary-lift),var(--primary-dim));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:27px;margin:0 auto 16px;box-shadow:var(--sh-primary)}
.login-header h1{font-size:21px;font-weight:800;margin-bottom:3px;letter-spacing:-.7px}
.login-header p{color:var(--text-dim);font-size:13px;font-weight:450}
.login-form .field{margin-bottom:18px}
.login-form label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--text-muted);font-weight:800;margin-bottom:6px}
.login-form input{width:100%;padding:11px 13px;font-size:13px;font-family:inherit;background:var(--surface2);border:1px solid var(--border);border-radius:14px;color:var(--text);outline:none;transition:border-color .18s,box-shadow .18s,background .18s}
.login-form input:focus{border-color:var(--primary);background:var(--surface);box-shadow:var(--sh-focus)}
.login-form input::placeholder{color:var(--text-muted)}
.login-error{background:var(--t-red);border:1px solid var(--t-red-b);color:var(--err);padding:9px 13px;border-radius:14px;font-size:12px;font-weight:600;margin-bottom:14px}
.login-btn{width:100%;padding:12px;background:linear-gradient(140deg,var(--primary-lift),var(--primary-dim));color:#fff;border:none;border-radius:999px;font-size:13px;font-weight:700;font-family:inherit;letter-spacing:-.1px;cursor:pointer;transition:filter .18s,transform .18s,box-shadow .18s;box-shadow:var(--sh-primary)}
.login-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.login-btn:active{transform:translateY(0)}
.login-btn:focus-visible{outline:none;box-shadow:var(--sh-focus),var(--sh-primary)}
.login-btn:disabled{opacity:.6;cursor:wait;filter:none;transform:none}
.login-footer{text-align:center;margin-top:24px;font-size:11px;color:var(--text-muted)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .login-card{background:var(--surface);border-color:var(--border)}
}

@media (prefers-reduced-motion:reduce){.login-btn:hover{transform:none}}

</style>
<script>
(function(){
  var form = document.getElementById('login-form');
  var err = document.getElementById('login-error');
  var btn = form.querySelector('.login-btn');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var u = document.getElementById('username').value;
    var p = document.getElementById('password').value;
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    fetch('{{.Data.LoginPath}}', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    }).then(function(r){return r.json()}).then(function(d){
      if(d.ok){
        window.location.href = '{{.Data.BasePath}}';
      } else {
        err.textContent = d.error || 'Login failed';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }).catch(function(e){
      err.textContent = 'Network error: ' + e.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    });
  });
})();
</script>
{{end}}
