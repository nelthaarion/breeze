{{define "layout"}}<!DOCTYPE html>
<html lang="{{.Locale}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>breeze/video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }
    header { background: #1a1a2e; color: #fff; padding: 1rem 2rem; }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    #breeze-app { max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    .lede { color: #555; margin-bottom: 1.5rem; line-height: 1.6; }
    .clip { background: #fff; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem;
            box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .clip h2 { font-size: .95rem; font-weight: 600; margin-bottom: .6rem; }
    video { width: 100%; background: #000; border-radius: 6px; display: block; }
    code { background: #eceff1; padding: .15rem .4rem; border-radius: 3px; font-size: .9em; }
    .empty { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 1.5rem; }
    .note { margin-top: 2rem; font-size: .85rem; color: #666; line-height: 1.7; }
  </style>
</head>
<body>
  <header><h1>breeze/video</h1></header>
  <div id="breeze-app">
    {{template "content" .}}
  </div>
</body>
</html>
{{end}}
