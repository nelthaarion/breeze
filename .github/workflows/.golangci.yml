# golangci-lint configuration.
#
# Wired into .github/workflows/ci.yml. Before this file existed the workflow's
# lint step was gated on `hashFiles('.golangci.yml', ...) != ''` — which was
# always empty, so the step never ran once. Fifteen unreachable symbols, two
# real logic bugs (a never-read config normalisation in the blast-radius walk,
# and a test comparing Default() to itself) and a deprecated-constructor call
# in an example all survived in the tree as a result.
#
# Scope is deliberately narrow: staticcheck plus unused, and the vet checks
# already in CI. Adding a style linter to a repository this size produces a
# thousand findings and teaches everyone to ignore the linter.
#
# There are no per-path exclusions, and that is the goal rather than an
# omission. This file briefly carried two — ST1012 for events/errors.go and
# ST1005 for internal/generator/ — and both were removed by fixing the code
# instead: `events.Stop` carries a //lint:ignore with its reason at the
# declaration, and the one generator message that actually tripped ST1005 lost
# a trailing period it did not need. A blanket `text: ST1005` over a 40-file
# package would have suppressed every future instance too, which is the
# difference between an exception and a blind spot.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - staticcheck
    - unused

  settings:
    staticcheck:
      # SA: correctness. S: simplification. ST: style/naming. QF: quickfix.
      # ST1000 (package comment presence) is excluded rather than enabled
      # wholesale: nine packages lack one, they are being written subsystem by
      # subsystem alongside their docs, and a blocking CI failure per missing
      # comment would stall unrelated work.
      checks:
        - all
        - -ST1000

formatters:
  enable:
    - gofmt
