name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Go vet
        run: go vet ./...


      - name: Build the nested Kafka backend module
        # fleet/transport/eventtransport/backends/kafka carries its own go.mod
        # so kafka-go stays out of the framework's dependency graph. The cost is
        # that ./... does not reach it, so nothing compiled it for months. This
        # step is the only thing that does.
        working-directory: fleet/transport/eventtransport/backends/kafka
        run: |
          go build ./...
          go vet ./...

      - name: Run tests
        # -short is deliberate. internal/mcp's live provisioning tests and
        # internal/generator's e2e tests build container images and compile
        # scaffolded projects; both skip under -short, and both take minutes.
        # They are developer tests against a real Docker daemon, not a gate —
        # tools_provision_live_test.go says so at the top of the file.
        run: go test -short ./...

      - name: Check internal documentation links
        # Every relative Markdown link in the repo must resolve. Fenced code
        # blocks are skipped: Go generics in examples (Inspect[T](bus)) are
        # indistinguishable from Markdown links to a regex.
        run: go run ./internal/tools/linkcheck .
